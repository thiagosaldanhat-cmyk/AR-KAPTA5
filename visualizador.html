<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071a32">
<title>KAPTA AR — Visualizador</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body class="viewer-page">
<header class="topbar viewer-topbar">
  <a class="back-link" href="index.html">← Voltar</a>
  <div class="brand compact">
    <span class="logo">K</span>
    <div><strong>KAPTA AR</strong><small>Visualização em escala real</small></div>
  </div>
</header>

<main class="viewer-container">
  <section class="viewer-heading">
    <span id="category" class="eyebrow"></span>
    <h1 id="name">Carregando modelo...</h1>
    <p>Gire o modelo com o dedo ou com o mouse. Para conferir no local, use o botão de realidade aumentada.</p>
  </section>

  <section class="viewer-card">
    <model-viewer
      id="model"
      camera-controls
      auto-rotate
      rotation-per-second="6deg"
      interaction-prompt="auto"
      shadow-intensity="1"
      shadow-softness=".8"
      exposure="1"
      environment-image="neutral"
      ar
      ar-placement="floor"
      ar-scale="fixed"
      ar-modes="webxr scene-viewer quick-look">
      <button slot="ar-button" class="ar-button">Ver no meu ambiente</button>
      <div slot="progress-bar" class="viewer-progress">
        <div class="viewer-progress-fill"></div>
      </div>
      <div class="viewer-error" slot="error">
        Não foi possível carregar este modelo.
      </div>
    </model-viewer>
  </section>

  <div class="viewer-actions">
    <a class="secondary-button" href="index.html">Trocar modelo</a>
  </div>
</main>

<script src="visualizador.js"></script>
</body>
</html>
